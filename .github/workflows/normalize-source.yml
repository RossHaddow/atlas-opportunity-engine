name: Normalize Atlas Source

on:
  push:
    branches: [main]
    paths:
      - 'atlas34.part.*'
      - 'scripts/restore-atlas.sh'
      - '.github/workflows/normalize-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify packed payload
        run: bash scripts/verify-atlas.sh .

      - name: Restore current Atlas source
        run: |
          rm -rf .atlas-restored app
          bash scripts/restore-atlas.sh . .atlas-restored
          mkdir -p app
          cp -a .atlas-restored/. app/
          rm -rf .atlas-restored

      - name: Confirm normalized source
        run: |
          test -n "$(find app -type f -print -quit)"
          echo "Normalized source files: $(find app -type f | wc -l)"
          find app -maxdepth 3 -type f -print | sort

      - name: Commit normalized source tree
        run: |
          git config user.name "atlas-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "Normalized source is already current."
            exit 0
          fi
          git commit -m "Normalize Atlas Build 40 source tree"
          git push
